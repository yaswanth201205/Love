<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>TEJ ♥ CHITTI Moon Logo</title>  <style>  
  
* {  
    box-sizing: border-box;  
}  
  
html,  
body {  
    margin: 0;  
    width: 100%;  
    height: 100%;  
}  
  
body {  
    overflow: hidden;  
  
    display: flex;  
    justify-content: center;  
    align-items: center;  
  
    background: #000000;  
}  
  
  
/* =========================  
   MAIN SCENE  
========================= */  
  
.scene {  
    position: relative;  
  
    width: 700px;  
    height: 500px;  
}  
  
  
/* =========================  
   MOON GLOW  
========================= */  
  
.glow {  
    position: absolute;  
  
    width: 320px;  
    height: 320px;  
  
    left: 85px;  
    top: 90px;  
  
    border-radius: 50%;  
  
    background: #ffd83d;  
  
    filter: blur(80px);  
  
    opacity: 0.20;  
  
    animation:  
        glowPulse 3s ease-in-out infinite alternate;  
}  
  
  
/* =========================  
   CRESCENT MOON  
========================= */  
  
.moon {  
    position: absolute;  
  
    width: 280px;  
    height: 280px;  
  
    left: 105px;  
    top: 110px;  
  
    border-radius: 50%;  
  
    background: #fff6a8;  
  
    box-shadow:  
        0 0 15px #fff6a8,  
        0 0 35px #ffe14a,  
        0 0 65px #ffc800,  
        0 0 100px rgba(255, 200, 0, 0.35);  
  
    animation:  
        moonFloat 4s ease-in-out infinite;  
}  
  
  
/* Black circle creates the crescent */  
  
.moon::after {  
    content: "";  
  
    position: absolute;  
  
    width: 280px;  
    height: 280px;  
  
    left: 90px;  
    top: -35px;  
  
    border-radius: 50%;  
  
    background: #000000;  
}  
  
  
/* =========================  
   LOGO TEXT  
========================= */  
  
.logo {  
    position: absolute;  
  
    z-index: 10;  
  
    left: 255px;  
    top: 195px;  
  
    color: #fffbea;  
  
    font-family:  
        "Trebuchet MS",  
        "Segoe UI",  
        Arial,  
        sans-serif;  
  
    font-size: 36px;  
  
    font-weight: 400;  
  
    font-style: italic;  
  
    letter-spacing: 4px;  
  
    white-space: nowrap;  
  
    text-shadow:  
        0 0 5px #ffffff,  
        0 0 12px #fff6a8,  
        0 0 25px #ffd83d,  
        0 0 45px #ffb800,  
        0 0 70px #ff9900;  
  
    animation:  
        textGlow 2s ease-in-out infinite alternate;  
}  
  
  
/* =========================  
   HEART  
========================= */  
  
.heart {  
    display: inline-block;  
  
    margin: 0 8px;  
  
    color: #ff3158;  
  
    font-size: 32px;  
  
    font-style: normal;  
  
    text-shadow:  
        0 0 5px #ff3158,  
        0 0 12px #ff3158,  
        0 0 25px #ff1744,  
        0 0 40px #ff003c;  
  
    animation:  
        heartBeat 1.2s ease-in-out infinite;  
}  
  
  
/* =========================  
   SMALL STARS  
========================= */  
  
.star {  
    position: absolute;  
  
    width: 4px;  
    height: 4px;  
  
    border-radius: 50%;  
  
    background: #ffffff;  
  
    box-shadow:  
        0 0 5px #ffffff,  
        0 0 12px #ffffff;  
  
    animation:  
        twinkle 1.8s ease-in-out infinite alternate;  
}  
  
.star.big {  
    width: 7px;  
    height: 7px;  
}  
  
.star.small {  
    width: 3px;  
    height: 3px;  
}  
  
  
/* =========================  
   STAR POSITIONS  
========================= */  
  
.s1 {  
    left: 45px;  
    top: 90px;  
    animation-delay: .1s;  
}  
  
.s2 {  
    left: 340px;  
    top: 55px;  
    animation-delay: .5s;  
}  
  
.s3 {  
    left: 590px;  
    top: 70px;  
    animation-delay: .9s;  
}  
  
.s4 {  
    left: 40px;  
    top: 370px;  
    animation-delay: 1.2s;  
}  
  
.s5 {  
    left: 610px;  
    top: 390px;  
    animation-delay: .4s;  
}  
  
.s6 {  
    left: 155px;  
    top: 40px;  
    animation-delay: 1.5s;  
}  
  
.s7 {  
    left: 475px;  
    top: 35px;  
    animation-delay: .7s;  
}  
  
.s8 {  
    left: 570px;  
    top: 300px;  
    animation-delay: 1.1s;  
}  
  
.s9 {  
    left: 65px;  
    top: 230px;  
    animation-delay: .2s;  
}  
  
.s10 {  
    left: 330px;  
    top: 430px;  
    animation-delay: 1.6s;  
}  
  
  
/* =========================  
   FOUR-POINT SPARKLES  
========================= */  
  
.sparkle {  
    position: absolute;  
  
    width: 18px;  
    height: 18px;  
  
    background: #ffffff;  
  
    clip-path: polygon(  
        50% 0%,  
        60% 40%,  
        100% 50%,  
        60% 60%,  
        50% 100%,  
        40% 60%,  
        0% 50%,  
        40% 40%  
    );  
  
    filter:  
        drop-shadow(0 0 6px #ffffff)  
        drop-shadow(0 0 15px #ffffff);  
  
    animation:  
        sparkle 2s ease-in-out infinite;  
}  
  
  
/* =========================  
   SPARKLE POSITIONS  
========================= */  
  
.p1 {  
    left: 70px;  
    top: 150px;  
}  
  
.p2 {  
    left: 340px;  
    top: 120px;  
    animation-delay: .6s;  
}  
  
.p3 {  
    left: 580px;  
    top: 180px;  
    animation-delay: 1.1s;  
}  
  
.p4 {  
    left: 520px;  
    top: 410px;  
    animation-delay: 1.6s;  
}  
  
  
/* =========================  
   GLOW ANIMATION  
========================= */  
  
@keyframes glowPulse {  
  
    from {  
        transform: scale(.9);  
        opacity: .12;  
    }  
  
    to {  
        transform: scale(1.15);  
        opacity: .28;  
    }  
  
}  
  
  
/* =========================  
   MOON FLOAT  
========================= */  
  
@keyframes moonFloat {  
  
    0%,  
    100% {  
        transform: translateY(0);  
    }  
  
    50% {  
        transform: translateY(-10px);  
    }  
  
}  
  
  
/* =========================  
   TEXT GLOW  
========================= */  
  
@keyframes textGlow {  
  
    from {  
  
        text-shadow:  
            0 0 5px #ffffff,  
            0 0 12px #fff6a8,  
            0 0 25px #ffd83d,  
            0 0 40px #ffb800;  
  
    }  
  
    to {  
  
        text-shadow:  
            0 0 8px #ffffff,  
            0 0 20px #fff6a8,  
            0 0 40px #ffd83d,  
            0 0 60px #ff9900,  
            0 0 80px #ff7700;  
  
    }  
  
}  
  
  
/* =========================  
   HEART BEAT  
========================= */  
  
@keyframes heartBeat {  
  
    0%,  
    100% {  
        transform: scale(1);  
    }  
  
    25% {  
        transform: scale(1.15);  
    }  
  
    40% {  
        transform: scale(1);  
    }  
  
    60% {  
        transform: scale(1.20);  
    }  
  
}  
  
  
/* =========================  
   STAR TWINKLE  
========================= */  
  
@keyframes twinkle {  
  
    from {  
        opacity: .15;  
        transform: scale(.5);  
    }  
  
    to {  
        opacity: 1;  
        transform: scale(1.5);  
    }  
  
}  
  
  
/* =========================  
   SPARKLE ANIMATION  
========================= */  
  
@keyframes sparkle {  
  
    0%,  
    100% {  
        opacity: .2;  
        transform: scale(.5) rotate(0deg);  
    }  
  
    50% {  
        opacity: 1;  
        transform: scale(1.4) rotate(45deg);  
    }  
  
}  
  
  
/* =========================  
   MOBILE  
========================= */  
  
@media (max-width: 700px) {  
  
    .scene {  
        transform: scale(.70);  
    }  
  
}  
  
</style>  </head>  <body>  <div class="scene">  <!-- Moon glow -->  
<div class="glow"></div>  


<!-- Crescent moon -->  
<div class="moon"></div>  


<!-- TEJ ♥ CHITTI -->  
<div class="logo">  
    TEJ  
    <span class="heart">♥</span>  
    CHITTI  
</div>  


<!-- Small stars -->  

<div class="star big s1"></div>  
<div class="star s2"></div>  
<div class="star small s3"></div>  
<div class="star big s4"></div>  
<div class="star s5"></div>  
<div class="star small s6"></div>  
<div class="star s7"></div>  
<div class="star big s8"></div>  
<div class="star small s9"></div>  
<div class="star s10"></div>  


<!-- Sparkling stars -->  

<div class="sparkle p1"></div>  
<div class="sparkle p2"></div>  
<div class="sparkle p3"></div>  
<div class="sparkle p4"></div>

</div>  </body>  
    </html>
